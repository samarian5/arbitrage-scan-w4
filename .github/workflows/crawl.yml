name: crawl

# A shard: one of N repos pulling from the same Postgres queue. No logic here —
# it calls the reusable worker in the main repo. Separate repos exist purely
# because GitHub concurrency groups are per repo.
#
# Header deliberately minimal. Both `permissions:` and `concurrency:` in a
# caller that uses a reusable workflow make GitHub reject the run at validation
# (conclusion: failure, zero jobs, no check-run). Concurrency lives in the
# called workflow, keyed by slot.
on:
  workflow_dispatch:
jobs:
  crawl:
    uses: samarian5/arbitrage-scan/.github/workflows/crawl-slice.yml@main
    with:
      slot: w4
      slices: 12
    # `inherit`, not an explicit map: naming secrets explicitly is also rejected
    # at validation, even when the caller has them.
    secrets: inherit
